[base]
name = .
coverage_dir = {env:COVERAGE_REPORT_DIR:coverage_reports}

[tox]
minversion = 4.0
skip_missing_interpreters = true
envlist = py313, build, lint

[testenv]
skip_install = true
allowlist_externals = uv
setenv =
    UV_PROJECT_ENVIRONMENT = {envdir}
    RUFF_CACHE_DIR = {envtmpdir}/ruff-cache
passenv =
    UV_*
    RUN_LIVE_UPSTREAM_TESTS
commands_pre =
    uv sync --locked --no-default-groups --group test --python {envpython}
commands =
    coverage run --source {[base]name} --data-file={[base]coverage_dir}/.coverage --omit alembic/*,tests/*,src/brokerage_service_api/dev/ogc_validator.py -m pytest --capture=no -s -v --tb=short --disable-warnings {posargs}
    coverage report --data-file={[base]coverage_dir}/.coverage -m --skip-covered
    coverage xml --data-file={[base]coverage_dir}/.coverage -o {[base]coverage_dir}/coverage.xml

[testenv:lint]
commands_pre =
    uv sync --locked --no-default-groups --group lint --python {envpython}
commands =
    ruff format --diff {[base]name}
    ruff check {[base]name}

[testenv:build]
commands_pre =
    uv sync --locked --no-default-groups --group build --python {envpython}
commands =
    uv build
    twine check dist/*

[testenv:format]
commands_pre =
    uv sync --locked --no-default-groups --group lint --python {envpython}
commands =
    ruff format {[base]name}
    ruff check --fix {[base]name}

[testenv:types]
commands_pre =
    uv sync --locked --no-default-groups --group types --python {envpython}
commands =
    pyright {[base]name}
