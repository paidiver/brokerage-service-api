# Default values for brokerage-service-api.

ingress:
  enabled: true
  path: ""
  pathType: Prefix
  ingressClassName: "traefik"
  annotations:
    # nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    # nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    # nginx.ingress.kubernetes.io/proxy-read-timeout: "300"

image:
  repository: ghcr.io/paidiver/brokerage-service-api
  pullPolicy: IfNotPresent
  imagePullSecret: brokerage-service-api-ghcr-pull-secret

searchSessions:
  maxBytes: "16000000"

resources:
  limits:
    cpu: 400m
    memory: 600Mi
  requests:
    cpu: 400m
    memory: 600Mi
