ingress:
  enabled: true
  host: api.paidiver-brokerage-service.noc.ac.uk
  path: ""
  ingressClassName: "traefik"
  tls:
    - secretName: letsencrypt-brokerage-service-api-dev
      hosts:
        - api.paidiver-brokerage-service.noc.ac.uk
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-brokerage-service-api-dev

resources:
  limits:
    cpu: 400m
    memory: 600Mi
  requests:
    cpu: 400m
    memory: 600Mi

image:
  tag: latest

env:
  bodcAnnotationsApiUrl: "https://annotations.bodc.ac.uk/api"
  jnccAnnotationsApiUrl: "https://annotations-api-jncc.atlantis-viz.online/api"
