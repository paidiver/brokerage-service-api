apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "brokerage-service-api.fullname" . }}
  labels:
    app: {{ include "brokerage-service-api.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
      component: {{ .Values.componentName }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        component: {{ .Values.componentName }}
    spec:
      {{- with .Values.image.imagePullSecret }}
      imagePullSecrets:
        - name: {{ . | quote }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: brokerage-service-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: REDIS_ENABLED
              value: {{ .Values.redis.cacheEnabled | quote }}
            - name: REDIS_DEFAULT_TTL_SECONDS
              value: {{ .Values.redis.defaultTtlSeconds | quote }}
            - name: REDIS_BACKEND
              value: {{ .Values.redis.backend | quote }}
            - name: REDIS_URL
              value: {{ include "brokerage-service-api.redisUrl" . | quote }}
            - name: SEARCH_SESSION_TTL_SECONDS
              value: {{ .Values.searchSessions.ttlSeconds | quote }}
            - name: SEARCH_SESSION_BATCH_SIZE
              value: {{ .Values.searchSessions.batchSize | quote }}
            - name: SEARCH_SESSION_PAGES_PER_REQUEST
              value: {{ .Values.searchSessions.pagesPerRequest | quote }}
            - name: SEARCH_SESSION_REQUEST_SECONDS
              value: {{ .Values.searchSessions.requestSeconds | quote }}
            - name: SEARCH_SESSION_MAX_BYTES
              value: {{ .Values.searchSessions.maxBytes | quote }}
            - name: SEARCH_SESSION_CREATIONS_PER_MINUTE
              value: {{ .Values.searchSessions.creationsPerMinute | quote }}
            - name: BODC_ANNOTATIONS_API_URL
              value: {{ .Values.env.bodcAnnotationsApiUrl | quote }}
            - name: JNCC_ANNOTATIONS_API_URL
              value: {{ .Values.env.jnccAnnotationsApiUrl | quote }}
          command: ["uvicorn", "brokerage_service_api.api.app:app"]
          args:
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8020"
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - containerPort: {{ .Values.container.port }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
