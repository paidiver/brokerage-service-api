[build-system]
requires = ["poetry-core>=2.0,<3", "poetry-dynamic-versioning>=1.0,<2"]
build-backend = "poetry_dynamic_versioning.backend"

[project]
name = "brokerage_service_api"
description = "Brokerage Service API"
readme = "README.md"
keywords = ["fastapi", "brokerage service"]
dynamic = ["version"]
requires-python = ">=3.13,<3.14"
authors = [{ name = "Tobias Ferreira", email = "tobias.ferreira@noc.ac.uk" }]
license = { file = "LICENSE" }
classifiers = ["Development Status :: 2 - Pre-Alpha", "Intended Audience :: Developers", "Intended Audience :: Science/Research", "Natural Language :: English", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.13"]
dependencies = [
  "fastapi>=0.137.2,<0.138.0",
  "uvicorn>=0.49.0,<0.50.0",
  "python-dotenv>=1.2.2,<2.0.0",
  "starlette>=1.3.1,<2.0.0",
  "pydantic==2.13.4",
  "pyyaml>=6.0.3,<7.0.0",
  "httpx>=0.28.1,<0.29.0",
  "redis>=5,<8",
  "fakeredis>=2.23,<3",
]

[project.urls]
Repository = "https://github.com/paidiver/brokerage-service-api"
Issues = "https://github.com/paidiver/brokerage-service-api/issues"

[dependency-groups]
lint = [
  "ruff>=0.4.2,<0.5.0",
]
dev = [
  "jupyterlab>=4.6.0,<5.0.0",
]
test = [
  "pytest>=7.3.0,<8.0.0",
  "pytest-cov>=4.0.0,<5.0.0",
  "pytest-mock==3.15.1",
  "tox>=4.0.0,<5.0.0",
  "faker>=40.0.0,<41.0.0",
  "factory-boy>=3.2.0,<4.0.0",
]
build = [
  "twine>=6.1.0,<7.0.0",
  "importlib-metadata==7.1.0",
]
types = ["pyright>=1.1,<2"]

# Retain the existing package layout and Git-based release versioning.
[tool.poetry]
packages = [{ include = "brokerage_service_api", from = "src" }]
version = "0.1.0"

[tool.pytest.ini_options]
markers = [
  "integration: tests that call live upstream services",
]

[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
style = "semver"

[tool.poetry-dynamic-versioning.substitution]
files = ["config/__init__.py"]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = [
  ".venv",
  "migrations",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["api", "config"]
